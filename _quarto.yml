project:
  type: website
  # Only the pages listed here are built into the site. Add each new
  # state page to this list when it's ready to go live.
  render:
    - index.qmd
    - alaska.qmd
    - info.qmd
  # Data files the pages read in the browser or offer for download
  resources:
    - data/alaska_2027.csv
    - alaska.js
    - apple-touch-icon.png

website:
  title: "Scientific Draw Odds"
  site-url: "https://scientificdrawodds.com"
  # An amber S on the dark background: 32 px for browser tabs, 180 px for phone home screens
  favicon: favicon.png
  description: "Free draw odds for big-game hunts, starting with Alaska."
  search: false
  open-graph: true
  navbar:
    collapse: false
    left:
      - text: "Home"
        href: index.qmd
      - text: "State"
        menu:
          - text: "Alaska"
            href: alaska.qmd
      - text: "Info"
        href: info.qmd

format:
  html:
    theme: [default, styles.scss]
    lang: en
    anchor-sections: false
    include-in-header:
      text: '<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">'
