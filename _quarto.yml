      - text: "Info"
        href: info.qmd
  page-footer:
    left: "© 2026 Conor McKinley"
    right: "Not affiliated with any state wildlife agency."

format:
  html:
    theme: [default, styles.scss]
    lang: en
    anchor-sections: false
