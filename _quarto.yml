project:
  type: website
  # Only the pages listed here are built into the site. Add each new
  # state page to this list when it's ready to go live.
  render:
    - index.qmd
    - alaska.qmd
    - info.qmd

website:
  title: "Scientific Draw Odds"
  site-url: "https://scientificdrawodds.com"
  description: "Free draw odds for big-game hunts, starting with Alaska."
  search: false
  open-graph: true
  navbar:
    collapse: false
    left:
      - text: "Home"
        href: index.qmd
      - text: "State"
        menu:
          - text: "Alaska"
            href: alaska.qmd
          - text: "New Mexico (January 2027)"
          - text: "Arizona (planned)"
          - text: "Colorado (planned)"
          - text: "Idaho (planned)"
          - text: "Montana (planned)"
          - text: "Nevada (planned)"
          - text: "Utah (planned)"
          - text: "Wyoming (planned)"
      - text: "Info"
        href: info.qmd

format:
  html:
    theme: [default, styles.scss]
    lang: en
    anchor-sections: false
